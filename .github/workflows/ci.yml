name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ui:
    name: UI (lint, format, types, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  native:
    name: Native (build, clang-format, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev clang-format
      - name: clang-format
        run: clang-format --dry-run --Werror native/src/*.cpp native/src/*.hpp native/tests/*.cpp
      - run: npm ci
        working-directory: ui
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: ctest --preset debug

  package:
    name: Debian package (build, install test on clean Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev dpkg-dev desktop-file-utils
      - run: npm ci
        working-directory: ui
      - run: cmake --preset package
      - run: cmake --build --preset package
      - run: cpack --preset deb
      - run: desktop-file-validate packaging/io.github.sxhumr.PageLite.desktop
      - name: Install, run and remove on a clean container
        run: packaging/test-deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: pagelite-deb
          path: build/package/dist/*.deb
          if-no-files-found: error
